[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structgate"
version = "0.1.0"
description = "Grammar-constrained generation with measured conformance and distribution cost"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["structgate*"]
