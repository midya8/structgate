name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_regeneration.py
      - run: python scripts/verify_automaton_regeneration.py
      - name: Original gates, unchanged controls
        run: python -m structgate gates --min-valid-rate 1 --min-conformance 1 --max-mean-kl 2 --max-unconstrained-rate .2
      - run: bash examples/demo.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.cjs
  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash examples/verify_wheel.sh
      - run: bash scripts/verify_automaton_install.sh
